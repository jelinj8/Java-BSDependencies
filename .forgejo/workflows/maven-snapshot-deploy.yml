# Publishes a Maven snapshot to Forgejo's own package registry on every push. Adapted from
# SYS/devenv's samples/maven-snapshot-deploy.yml for this repo specifically:
#
# This is a multi-module BOM project (packaging=pom, parent + 16 submodules under <modules>, no
# real Java source) with FOUR independently-versioned branches instead of one mainline
# (java-8 -> 1.8.x-SNAPSHOT, java-11 -> 1.11.x-SNAPSHOT, java-17 -> 1.17.x-SNAPSHOT,
# java-21 -> 1.21.x-SNAPSHOT - each branch's own pom.xml already encodes its JDK target in the
# version, so there's no collision risk between them). `master` is excluded from the trigger list
# below - its pom has a literal placeholder revision ("1.XX.1-SNAPSHOT"), it doesn't look like a
# buildable branch. A plain `mvn deploy` from the root (no -N) builds/deploys the whole reactor -
# parent + all 16 modules - in one run, which is what's wanted here.
#
# No EXTRA_MAVEN_OWNERS needed - the cz.bliksoft.java groupIds in this pom are all inside
# <dependencyManagement> (declared managed versions for consumers), not actual <dependencies> of
# this project itself, so there's nothing to resolve from another registry.
#
# This file lives on GitHub (the real source of truth, which Forgejo pull-mirrors) rather than
# being pushed directly to the Forgejo side - a commit made only on the Forgejo side of a pull
# mirror would very likely be silently discarded on the next sync from GitHub.
#
# Only the modules that actually changed (plus the root parent BOM) are deployed on a normal
# push - see the "Determine modules to deploy" step. maven-deploy-plugin's deployAtEnd defaults
# to true, which batches every reactor artifact's upload into one shot fired at the very end of
# the build; that's suspected to be why, before this fix, only the LAST-built module
# (dependency-management-junit, last under root <modules>) ever actually showed up in the
# registry despite the job reporting success - deploying per-module instead (-DdeployAtEnd=false)
# avoids that batch entirely. Trigger a manual run with force_all=true (the default) to back-fill
# every module's package after this change first lands, or whenever a full redeploy is needed.

on:
  push:
    branches: [java-8, java-11, java-17, java-21]
  workflow_dispatch:
    inputs:
      force_all:
        description: "Deploy every module regardless of what changed (use to back-fill the registry)"
        type: boolean
        default: true

jobs:
  snapshot-deploy:
    runs-on: maven-jdk
    # Pin an explicit local repo path and force a fresh SNAPSHOT check every run - see
    # SYS/devenv's samples/maven-snapshot-deploy.yml header for why both are needed given the
    # runner's shared, persistent Maven cache.
    env:
      MAVEN_OPTS: "-Dmaven.repo.local=/tmp/m2-repo"
    steps:
      - name: Clone repository
        run: |
          git clone --branch "${{ github.ref_name }}" \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@${{ vars.REGISTRY_URL }}/${{ github.repository }}.git" src

      - name: Write Maven settings.xml
        run: |
          cat > settings.xml <<'SETTINGSEOF'
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0">
            <servers>
              <server>
                <id>forgejo-deploy</id>
                <username>bot</username>
                <password>${env.MVN_TOKEN}</password>
              </server>
            </servers>
          </settings>
          SETTINGSEOF

      - name: Determine modules to deploy
        working-directory: src
        env:
          FORCE_ALL: ${{ github.event.inputs.force_all }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          MODULES="client freemarker flyingsaucer jaxb hibernate mariadb mysql log4j mail ooxml service servicedef ojdbc httpclient slf4j junit"
          PL_ARG=""

          if [ "$FORCE_ALL" = "true" ]; then
            echo "force_all requested - deploying every module"
          elif [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "no previous commit to diff against (first push on this branch) - deploying every module"
          else
            DIFF=$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA")
            if echo "$DIFF" | grep -qx 'pom.xml'; then
              echo "root pom.xml changed - deploying every module"
            else
              CHANGED=""
              for m in $MODULES; do
                if echo "$DIFF" | grep -q "^$m/"; then
                  CHANGED="$CHANGED,$m"
                fi
              done
              if [ -z "$CHANGED" ]; then
                echo "no module directories changed - nothing to deploy"
                PL_ARG="-pl ."
              else
                PL_ARG="-pl .$CHANGED"
              fi
            fi
          fi

          echo "PL_ARG=$PL_ARG" >> "$GITHUB_ENV"

      - name: Build (verify) the whole reactor
        working-directory: src
        run: mvn -B -U verify

      - name: Deploy the reactor
        working-directory: src
        run: |
          mvn -B -U -s ../settings.xml deploy -DskipTests -DdeployAtEnd=false $PL_ARG \
            -DaltDeploymentRepository=forgejo-deploy::default::https://${{ vars.REGISTRY_URL }}/api/packages/${{ github.repository_owner }}/maven
        env:
          MVN_TOKEN: ${{ secrets.ORG_PACKAGES_TOKEN }}

      - name: Determine parent coordinates
        working-directory: src
        run: |
          echo "ARTIFACT_ID=$(mvn -B -q help:evaluate -Dexpression=project.artifactId -DforceStdout)" >> "$GITHUB_ENV"

      - name: Link packages to this repo (best-effort, cosmetic only)
        run: |
          # Links the parent BOM's package (dependency-management) and every submodule package
          # (dependency-management-*) to this repo - purely a Packages-tab display nicety,
          # doesn't affect consumption of any of them. Matches on exact name / "<name>-" prefix
          # rather than a plain substring - with 16+ similarly-named packages in the registry, a
          # bare `contains($a)` matches all of them and just links whichever the API happens to
          # list first.
          OWNER=$(echo "${{ github.repository }}" | cut -d/ -f1)
          REPO_NAME=$(echo "${{ github.repository }}" | cut -d/ -f2)
          PKG_NAMES=$(curl -sf -u "bot:${{ secrets.ORG_PACKAGES_TOKEN }}" \
            "https://${{ vars.REGISTRY_URL }}/api/v1/packages/$OWNER?type=maven" \
            | jq -r --arg a "$ARTIFACT_ID" '.[] | select(.name == $a or (.name | startswith($a + "-"))) | .name' | sort -u)
          for PKG_NAME in $PKG_NAMES; do
            curl -s -w "link status=%{http_code} pkg=$PKG_NAME\n" -u "bot:${{ secrets.ORG_PACKAGES_TOKEN }}" -X POST \
              "https://${{ vars.REGISTRY_URL }}/api/v1/packages/$OWNER/maven/$PKG_NAME/-/link/$REPO_NAME"
          done
