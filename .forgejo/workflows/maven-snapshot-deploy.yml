# Publishes a Maven snapshot to Forgejo's own package registry on every push. Adapted from
# SYS/devenv's samples/maven-snapshot-deploy.yml for this repo specifically:
#
# This is a multi-module BOM project (packaging=pom, parent + 16 submodules under <modules>, no
# real Java source) with FOUR independently-versioned branches instead of one mainline
# (java-8 -> 1.8.x-SNAPSHOT, java-11 -> 1.11.x-SNAPSHOT, java-17 -> 1.17.x-SNAPSHOT,
# java-21 -> 1.21.x-SNAPSHOT - each branch's own pom.xml already encodes its JDK target in the
# version, so there's no collision risk between them). `master` is excluded from the trigger list
# below - its pom has a literal placeholder revision ("1.XX.1-SNAPSHOT"), it doesn't look like a
# buildable branch. A plain `mvn deploy` from the root (no -N) builds/deploys the whole reactor -
# parent + all 16 modules - in one run, which is what's wanted here.
#
# No EXTRA_MAVEN_OWNERS needed - the cz.bliksoft.java groupIds in this pom are all inside
# <dependencyManagement> (declared managed versions for consumers), not actual <dependencies> of
# this project itself, so there's nothing to resolve from another registry.
#
# This file lives on GitHub (the real source of truth, which Forgejo pull-mirrors) rather than
# being pushed directly to the Forgejo side - a commit made only on the Forgejo side of a pull
# mirror would very likely be silently discarded on the next sync from GitHub.

on:
  push:
    branches: [java-8, java-11, java-17, java-21]
  workflow_dispatch:

jobs:
  snapshot-deploy:
    runs-on: maven-jdk
    # Pin an explicit local repo path and force a fresh SNAPSHOT check every run - see
    # SYS/devenv's samples/maven-snapshot-deploy.yml header for why both are needed given the
    # runner's shared, persistent Maven cache.
    env:
      MAVEN_OPTS: "-Dmaven.repo.local=/tmp/m2-repo"
    steps:
      - name: Clone repository
        run: |
          git clone --depth 1 --branch "${{ github.ref_name }}" \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@${{ vars.REGISTRY_URL }}/${{ github.repository }}.git" src

      - name: Write Maven settings.xml
        run: |
          cat > settings.xml <<'SETTINGSEOF'
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0">
            <servers>
              <server>
                <id>forgejo-deploy</id>
                <username>bot</username>
                <password>${env.MVN_TOKEN}</password>
              </server>
            </servers>
          </settings>
          SETTINGSEOF

      - name: Build (verify) the whole reactor
        working-directory: src
        run: mvn -B -U verify

      - name: Deploy the whole reactor
        working-directory: src
        run: |
          mvn -B -U -s ../settings.xml deploy -DskipTests \
            -DaltDeploymentRepository=forgejo-deploy::default::https://${{ vars.REGISTRY_URL }}/api/packages/${{ github.repository_owner }}/maven
        env:
          MVN_TOKEN: ${{ secrets.ORG_PACKAGES_TOKEN }}

      - name: Determine parent coordinates
        working-directory: src
        run: |
          echo "ARTIFACT_ID=$(mvn -B -q help:evaluate -Dexpression=project.artifactId -DforceStdout)" >> "$GITHUB_ENV"

      - name: Link parent package to this repo (best-effort, cosmetic only)
        run: |
          # Only links the parent BOM's own package (dependency-management) - the 16 submodule
          # packages stay unlinked, same as any other package that isn't explicitly linked; purely
          # a Packages-tab display nicety, doesn't affect consumption of any of them.
          OWNER=$(echo "${{ github.repository }}" | cut -d/ -f1)
          REPO_NAME=$(echo "${{ github.repository }}" | cut -d/ -f2)
          PKG_NAME=$(curl -sf -u "bot:${{ secrets.ORG_PACKAGES_TOKEN }}" \
            "https://${{ vars.REGISTRY_URL }}/api/v1/packages/$OWNER?type=maven" \
            | jq -r --arg a "$ARTIFACT_ID" '.[] | select(.name | contains($a)) | .name' | head -1)
          curl -s -w 'link status=%{http_code}\n' -u "bot:${{ secrets.ORG_PACKAGES_TOKEN }}" -X POST \
            "https://${{ vars.REGISTRY_URL }}/api/v1/packages/$OWNER/maven/$PKG_NAME/-/link/$REPO_NAME"
